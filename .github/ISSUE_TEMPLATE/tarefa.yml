name: Tarefa do projeto
description: Correção, melhoria ou nova função
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: [Correção, Melhoria, Nova Função]
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo e critérios de aceite
    validations:
      required: true
  - type: textarea
    id: verificacao
    attributes:
      label: Validação e publicação
